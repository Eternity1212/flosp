[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedosp"
version = "0.1.0"
description = "Ordinal-Style Prototype Federated Learning for Multi-Center Diabetic Retinopathy Grading"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "federated-learning",
    "diabetic-retinopathy",
    "fundus-image",
    "vision-transformer",
    "lora",
    "domain-generalization",
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9.16",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "Pillow>=9.0",
    "opencv-python-headless>=4.5",
    "matplotlib>=3.5",
    "PyYAML>=6.0",
    "tqdm>=4.62",
]

[project.optional-dependencies]
# 可选：用 Flower 跑真实多进程联邦（默认是单进程模拟，不需要它）
flower = ["flwr>=1.7"]
dev = ["pytest>=7.0", "ruff>=0.1", "seaborn>=0.12"]

[project.urls]
Repository = "https://github.com/Eternity1212/flosp"

[tool.setuptools.packages.find]
include = ["fedosp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 行长交给 formatter；B008 是 argparse 的常见写法
ignore = ["E501", "B008"]
